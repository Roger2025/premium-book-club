<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>高品質讀書會 | 典藏影音庫</title>

    <!-- 👇 強制瀏覽器每次都向伺服器要最新檔案，禁止快取 👇 -->
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <!-- 👆 防快取設定結束 👆 -->

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="讀書會" />
    <link rel="apple-touch-icon" href="icon.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Noto+Serif+TC:wght@300;400;700;900&family=Playfair+Display:ital@0;1&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --gold: #d4af37;
        --gold-glow: rgba(212, 175, 55, 0.6);
        --bg-dark: #09090b;
        --card-bg: rgba(20, 20, 20, 0.6);
        --glass-border: rgba(255, 255, 255, 0.08);
        --text-main: #f5f5f5;
        --text-sub: #a3a3a3;
        --blood-red: #ff4757;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        background-color: var(--bg-dark);
        color: var(--text-main);
        font-family: "Noto Serif TC", serif;
        overflow-x: hidden;
        line-height: 1.6;
      }

      /* --- 啟動畫面 (Splash Screen) --- */
      #splash-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: var(--bg-dark);
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
        transition:
          opacity 0.5s ease-out,
          visibility 0.5s ease-out;
      }

      .splash-content {
        text-align: center;
      }

      .splash-logo {
        font-family: "Cinzel", serif;
        font-size: 2.5rem;
        color: var(--gold);
        text-shadow: 0 0 20px var(--gold-glow);
        margin-bottom: 30px;
        letter-spacing: 2px;
        animation: pulseGold 2s infinite alternate;
      }

      .splash-loader {
        width: 100px;
        height: 2px;
        background: rgba(255, 255, 255, 0.1);
        margin: 0 auto;
        position: relative;
        overflow: hidden;
      }

      .splash-loader::after {
        content: "";
        position: absolute;
        left: -50px;
        width: 50px;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          var(--gold),
          transparent
        );
        animation: goldScan 1.2s infinite linear;
      }

      .splash-hidden {
        opacity: 0;
        visibility: hidden;
      }

      @keyframes pulseGold {
        0% {
          opacity: 0.7;
          transform: scale(0.98);
        }
        100% {
          opacity: 1;
          transform: scale(1.02);
        }
      }

      @keyframes goldScan {
        0% {
          left: -50px;
        }
        100% {
          left: 100%;
        }
      }

      /* --- 背景星空動畫 Canvas --- */
      #canvas-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        background: radial-gradient(
          ellipse at bottom,
          #1b2735 0%,
          #090a0f 100%
        );
      }

      /* --- 核心精神區 (Quote) --- */
      .hero-section {
        min-height: 90vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 4rem 2rem 2rem;
        position: relative;
      }

      .main-title {
        font-family: "Cinzel", serif;
        font-size: 3.5rem;
        color: var(--gold);
        text-shadow: 0 0 20px var(--gold-glow);
        margin-bottom: 3rem;
        letter-spacing: 0.2em;
        animation: fadeInDown 1s ease-out;
      }

      .quotes-container {
        display: flex;
        flex-direction: column;
        gap: 2rem;
        width: 100%;
        align-items: center;
      }

      .quote-card {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--glass-border);
        padding: 3rem;
        width: 100%;
        max-width: 800px;
        position: relative;
        backdrop-filter: blur(10px);
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        border-radius: 8px;
        animation: slideUp 1s ease-out both;
        transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
      }

      /* 滑鼠懸停時的浮起與金光效果 */
      .quote-card:hover {
        border-color: var(--gold);
        transform: translateY(-8px);
        box-shadow:
          0 15px 40px rgba(0, 0, 0, 0.5),
          0 0 25px var(--gold-glow);
        background: rgba(255, 255, 255, 0.05);
      }

      /* 第二張卡片延遲出現 */
      .quote-card.delay-anim {
        animation-delay: 0.4s;
      }

      .quote-card::before {
        content: "❝";
        position: absolute;
        top: -25px;
        left: 20px;
        font-size: 5rem;
        color: rgba(255, 255, 255, 0.08);
        font-family: "Playfair Display", serif;
      }

      .jung-quote {
        font-size: 1.5rem;
        color: #e0e0e0;
        line-height: 2.2;
        text-align: center;
        letter-spacing: 3px;
        font-weight: 300;
      }

      /* 命運：血紅色 */
      .highlight-fate {
        color: var(--blood-red);
        font-size: 1.4em;
        font-weight: 900;
        text-shadow: 0 0 20px rgba(255, 71, 87, 0.5);
        margin: 0 5px;
        display: inline-block;
        transform: translateY(2px);
      }

      /* 即見如來：金光色 */
      .highlight-gold {
        color: var(--gold);
        font-size: 1.4em;
        font-weight: 900;
        text-shadow: 0 0 25px var(--gold-glow);
        margin: 0 5px;
        display: inline-block;
        transform: translateY(2px);
      }

      .quote-book {
        text-align: right;
        font-style: italic;
        color: var(--text-sub);
        margin-top: 1.5rem;
        letter-spacing: 1px;
      }

      /* --- 導覽列 (年份過濾) --- */
      .year-nav-wrapper {
        position: sticky;
        top: 0;
        z-index: 100;
        background: rgba(9, 9, 11, 0.85);
        backdrop-filter: blur(15px);
        border-bottom: 1px solid var(--glass-border);
        padding: 15px 20px;
        margin-bottom: 3rem;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
      }

      .year-nav-container {
        max-width: 1000px;
        margin: 0 auto;
        display: flex;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
        /* 隱藏原生捲軸但保留滾動功能 */
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      .year-nav-container::-webkit-scrollbar {
        display: none;
      }

      .nav-btn {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--glass-border);
        color: var(--text-main);
        padding: 8px 24px;
        border-radius: 30px;
        cursor: pointer;
        font-family: "Cinzel", "Noto Serif TC", serif;
        font-size: 1rem;
        letter-spacing: 2px;
        transition: all 0.3s ease;
        white-space: nowrap; /* 確保按鈕文字不換行 */
        flex-shrink: 0; /* 確保按鈕在手機上不會被擠壓變形 */
      }

      .nav-btn:hover {
        background: rgba(212, 175, 55, 0.2);
        border-color: var(--gold);
        color: var(--gold);
      }

      .nav-btn.active {
        background: var(--gold);
        color: #000;
        border-color: var(--gold);
        font-weight: bold;
        box-shadow: 0 0 15px var(--gold-glow);
      }

      /* --- 生日專區 --- */
      .birthdays-container {
        max-width: 1200px;
        margin: 0 auto 4rem;
        padding: 2rem;
        text-align: center;
      }

      .section-header {
        font-size: 1.8rem;
        color: var(--gold);
        margin-bottom: 2rem;
        display: inline-block;
        border-bottom: 2px solid var(--gold);
        padding-bottom: 0.5rem;
        font-family: "Cinzel", serif;
      }

      .birthday-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
      }

      .birthday-card {
        background: linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.05),
          rgba(255, 255, 255, 0.01)
        );
        border: 1px solid var(--glass-border);
        padding: 1.5rem;
        border-radius: 12px;
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      }

      .birthday-card:hover {
        border-color: var(--gold);
        transform: translateY(-8px);
        box-shadow: 0 10px 25px var(--gold-glow);
        background: rgba(255, 255, 255, 0.08);
      }

      .b-name {
        font-size: 1.2rem;
        font-weight: bold;
        color: #fff;
      }

      .b-date {
        color: var(--gold);
        font-family: "Cinzel", serif;
        margin-top: 5px;
      }

      /* --- 影片列表區 --- */
      .timeline-container {
        max-width: 1000px;
        margin: 0 auto;
        padding: 0 20px 40px;
        position: relative;
        min-height: 50vh;
      }

      .year-separator {
        text-align: center;
        margin: 60px 0 40px;
        position: relative;
      }

      .year-text {
        font-size: 4rem;
        font-weight: bold;
        color: rgba(255, 255, 255, 0.05);
        -webkit-text-stroke: 1px var(--gold);
        font-family: "Cinzel", serif;
      }

      .video-card {
        display: flex;
        flex-direction: column;
        background: var(--card-bg);
        border: 1px solid var(--glass-border);
        border-radius: 16px;
        overflow: hidden;
        margin-bottom: 40px;
        transition: all 0.4s ease;
        position: relative;
      }

      @media (min-width: 768px) {
        .video-card {
          flex-direction: row;
          /* 確保卡片可以隨內容高度伸展 */
          min-height: 300px;
        }
      }

      .video-card:hover {
        border-color: rgba(212, 175, 55, 0.8);
        box-shadow: 0 10px 40px rgba(212, 175, 55, 0.2);
        transform: translateY(-3px);
      }

      .card-special {
        border: 1px solid var(--gold);
        box-shadow: 0 0 20px rgba(212, 175, 55, 0.15);
      }

      .video-wrapper {
        flex: 1;
        min-height: 200px;
        position: relative;
      }

      .video-wrapper iframe {
        position: absolute;
        width: 100%;
        height: 100%;
        border: none;
      }

      .content-wrapper {
        flex: 1;
        padding: 25px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .v-date {
        color: var(--gold);
        font-family: "Cinzel", serif;
        font-size: 0.9rem;
        margin-bottom: 10px;
        letter-spacing: 1px;
      }

      .v-title {
        font-size: 1.5rem;
        margin-bottom: 15px;
        color: #fff;
        line-height: 1.3;
      }

      .v-desc {
        font-size: 0.95rem;
        color: #aaa;
        margin-bottom: 15px;
        line-height: 1.6;
      }

      .left-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .v-tag {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 0.8rem;
        font-weight: bold;
      }
      .tag-summary {
        background: var(--gold);
        color: #000;
      }
      .tag-bday {
        background: #e91e63;
        color: #fff;
      }
      .tag-solo {
        background: #e0f2f1;
        color: #00695c;
        box-shadow: 0 0 10px rgba(0, 105, 92, 0.5);
      }
      .tag-normal {
        background: rgba(255, 255, 255, 0.1);
        color: #ccc;
      }

      .copy-btn {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--glass-border);
        color: var(--text-sub);
        padding: 4px 10px;
        border-radius: 20px;
        cursor: pointer;
        font-size: 0.8rem;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        gap: 4px;
        font-family: "Noto Serif TC", serif;
      }

      .copy-btn:hover {
        background: rgba(255, 255, 255, 0.15);
        color: #fff;
        border-color: #fff;
      }
      .copy-btn.copied {
        background: rgba(46, 204, 113, 0.2);
        border-color: #2ecc71;
        color: #2ecc71;
      }

      .link-group {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 10px;
        flex-wrap: wrap;
        gap: 10px;
      }

      .yt-link-btn {
        background: rgba(212, 175, 55, 0.05);
        border: 1px solid var(--gold);
        color: var(--gold);
        padding: 6px 14px;
        border-radius: 20px;
        cursor: pointer;
        font-size: 0.8rem;
        font-weight: bold;
        font-family: "Noto Serif TC", serif;
        transition: all 0.3s ease;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        white-space: nowrap;
      }

      .yt-link-btn:hover {
        background: var(--gold);
        color: #000;
        box-shadow: 0 0 10px var(--gold-glow);
      }

      /* --- 滾動浮現動畫 --- */
      .fade-in-element {
        opacity: 0;
        transform: translateY(40px);
        transition:
          opacity 0.8s cubic-bezier(0.25, 0.8, 0.25, 1),
          transform 0.8s cubic-bezier(0.25, 0.8, 0.25, 1);
      }
      .fade-in-element.visible {
        opacity: 1;
        transform: translateY(0);
      }

      /* --- 未完待續區塊 --- */
      .tbc-section {
        text-align: center;
        padding: 40px 20px 100px;
        position: relative;
      }
      .tbc-text {
        font-family: "Noto Serif TC", serif;
        font-size: 2.8rem;
        font-weight: 700;
        color: var(--gold);
        letter-spacing: 8px;
        text-shadow: 0 0 25px var(--gold-glow);
      }
      .tbc-eng {
        font-family: "Cinzel", serif;
        font-size: 1.2rem;
        color: var(--text-sub);
        letter-spacing: 4px;
        margin-top: 15px;
      }
      .tbc-dot {
        width: 8px;
        height: 8px;
        background: var(--gold);
        border-radius: 50%;
        margin: 25px auto 0;
        box-shadow: 0 0 15px var(--gold);
        animation: blink 1.5s infinite alternate;
      }

      @keyframes fadeInDown {
        from {
          opacity: 0;
          transform: translateY(-30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes blink {
        0% {
          opacity: 0.2;
          transform: scale(0.8);
        }
        100% {
          opacity: 1;
          transform: scale(1.2);
        }
      }

      /* 手機適配 */
      @media (max-width: 768px) {
        .main-title {
          font-size: 2.2rem;
        }
        .quote-card {
          padding: 2rem 1.5rem;
        }
        .jung-quote {
          font-size: 1.2rem;
          letter-spacing: 1px;
        }
        .highlight-fate,
        .highlight-gold {
          font-size: 1.3em;
        }
        .year-text {
          font-size: 3rem;
        }
        .tbc-text {
          font-size: 2rem;
          letter-spacing: 4px;
        }
        .link-group {
          flex-direction: column;
          align-items: flex-start;
        }
        .yt-link-btn {
          align-self: flex-end;
        }

        /* 針對手機版導覽列的修正：改為橫向滑動 */
        .year-nav-wrapper {
          padding: 12px 15px;
        }
        .year-nav-container {
          justify-content: flex-start; /* 靠左對齊，讓滑動感覺更自然 */
          flex-wrap: nowrap; /* 禁止換行 */
          overflow-x: auto; /* 開啟橫向滾動 */
          -webkit-overflow-scrolling: touch; /* iOS 順滑滾動支援 */
        }
        .nav-btn {
          padding: 6px 18px;
          font-size: 0.9rem;
        }
      }
    </style>
  </head>

  <body>
    <div id="splash-screen">
      <div class="splash-content">
        <h1 class="splash-logo">Premium<br />Book Club</h1>
        <div class="splash-loader"></div>
      </div>
    </div>
    <canvas id="canvas-bg"></canvas>

    <!-- 核心精神區 -->
    <section class="hero-section">
      <h1 class="main-title">Premium Book Club ⭐</h1>

      <div class="quotes-container">
        <!-- 第一張：榮格 -->
        <div class="quote-card">
          <p class="jung-quote">
            如果你無法意識到無意識，<br />

        <!-- 第二張：金剛經 -->
        <div class="quote-card delay-anim">
          <p class="jung-quote">
            凡所有相，皆是虛妄。<br />
            若見諸相非相，<span class="highlight-gold">即見如來</span>。
          </p>
          <p class="quote-book">—— 《金剛經》</p>

      </div>
    </section>

    <!-- 生日專區 -->
    <section class="birthdays-container fade-in-element">
      <h2 class="section-header">🎂 讀書會成員生日 🎂</h2>
      <div class="birthday-grid">
        <div class="birthday-card">
          <div class="b-name">阿如</div>
          <div class="b-date">Feb 10</div>
        </div>
        <div class="birthday-card">

          <div class="b-date">May 21</div>

    <!-- 導覽列 (動態生成) -->

      <div id="year-nav" class="year-nav-container">
        <!-- JS 會在這裡動態插入按鈕 -->

    <!-- 影片列表區 -->

    <div class="tbc-section fade-in-element">
      <div class="tbc-text">未 完 待 續</div>
      <div class="tbc-eng">TO BE CONTINUED...</div>
      <div class="tbc-dot"></div>
    </div>

    <script>
      // ================= 啟動畫面控制 =================
      window.addEventListener("load", () => {
        setTimeout(() => {
          document
            .getElementById("splash-screen")
            .classList.add("splash-hidden");
        }, 500);
      });

      // ================= 複製功能 =================
      window.copyToClipboard = function (url, btnElement) {
        const originalText = btnElement.innerHTML;
        const showSuccess = () => {
          btnElement.innerHTML = "✅ 已複製";
          btnElement.classList.add("copied");
          setTimeout(() => {
            btnElement.innerHTML = originalText;
            btnElement.classList.remove("copied");
          }, 2000);
        };
        const showError = () => {
          alert("瀏覽器阻擋自動複製，請手動複製右側網址！");
        };

        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard
            .writeText(url)
            .then(showSuccess)
            .catch(() => {
              fallbackCopyTextToClipboard(url, showSuccess, showError);
            });
        } else {
          fallbackCopyTextToClipboard(url, showSuccess, showError);
        }
      };

      function fallbackCopyTextToClipboard(text, onSuccess, onError) {
        var textArea = document.createElement("textarea");
        textArea.value = text;
        textArea.style.top = "0";
        textArea.style.left = "0";
        textArea.style.position = "fixed";
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        try {
          document.execCommand("copy") ? onSuccess() : onError();
        } catch (err) {
          onError();
        }
        document.body.removeChild(textArea);
      }

      // ================= 資料庫 =================
      const videos = [
        {
          date: "2024-12-14",
          type: "list",
          id: "PLtb0PhW5ohcUKP8HWwwY4b98ApRSPvyeq",
          title: "高品質讀書會：啟程",
          desc: "探索未知的知識領域，重新定義閱讀的意義，為我們的成長之旅揭開序幕。",
        },
        {
          date: "2025-01-18",
          type: "list",
          id: "PLtb0PhW5ohcU5rNTnr8iBqWUT0P3b5ai_",
          title: "高品質讀書會：一月號",
          desc: "新的一年，從重塑原子習慣開始，探討如何在細微處建立巨大的影響力。",
        },
        {
          date: "2025-02-22",
          type: "list",

          isSolo: true,

        {

          id: "PLU77Q9rVPp0A",
          title: "高品質讀書會：八月號",
          desc: "一場震撼靈魂的深度碰撞！本月我們拆解伊隆·馬斯克（Elon Musk）近乎瘋狂的創業血淚史，看他如何在破產邊緣與絕望中，憑藉鋼鐵般的意志撕裂現實，締造改寫人類文明的偉業。與此同時，我們將目光轉向內在，深度剖析「自我、小我、高我、無我」四個維度的精神蛻變。這不僅是一次對商業巨頭的仰望，更是一場直指人心的靈魂拷問——在浩瀚的宇宙與短暫的生命中，我們該如何粉碎虛妄的自我，觸摸那至高無上的精神境界？",

      // ================= 滾動監聽器 =================
      const scrollObserver = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              entry.target.classList.add("visible");
              scrollObserver.unobserve(entry.target);
            }
          });
        },
        { threshold: 0.1, rootMargin: "0px 0px -50px 0px" },
      );

      // ================= 渲染邏輯與年份導覽 =================
      const timeline = document.getElementById("timeline");
      const navContainer = document.getElementById("year-nav");

      // 按日期排序
      videos.sort((a, b) => new Date(a.date) - new Date(b.date));

      // 提取所有獨立的年份
      const years = [...new Set(videos.map((v) => v.date.split("-")[0]))];

      // 建立導覽列按鈕
      function buildNav() {
        // "全部"按鈕
        const allBtn = document.createElement("button");
        allBtn.className = "nav-btn active";
        allBtn.innerText = "全部 (All)";
        allBtn.onclick = () => filterTimeline("all", allBtn);
        navContainer.appendChild(allBtn);

        // 各年份按鈕
        years.forEach((year) => {
          const btn = document.createElement("button");
          btn.className = "nav-btn";
          btn.innerText = year + " 年";
          btn.onclick = () => filterTimeline(year, btn);
          navContainer.appendChild(btn);
        });
      }

      // 過濾並渲染時間軸
      function filterTimeline(filterYear, clickedBtn) {
        // 更新按鈕樣式
        document
          .querySelectorAll(".nav-btn")
          .forEach((btn) => btn.classList.remove("active"));
        if (clickedBtn) clickedBtn.classList.add("active");

        // 清空當前內容
        timeline.innerHTML = "";

        let currentYear = "";
        const filteredVideos =
          filterYear === "all"
            ? videos
            : videos.filter((v) => v.date.startsWith(filterYear));

        filteredVideos.forEach((v) => {
          const videoYear = v.date.split("-")[0];
          const videoDate = v.date.replace(/-/g, " / ");

          // 插入年份分隔線
          if (videoYear !== currentYear) {
            currentYear = videoYear;
            const yearDiv = document.createElement("div");
            yearDiv.className = "year-separator fade-in-element";
            yearDiv.innerHTML = `<div class="year-text">${currentYear}</div>`;
            timeline.appendChild(yearDiv);
            scrollObserver.observe(yearDiv);
          }

          // 標籤與樣式判斷
          let tags = "";
          let specialClass = "";

          if (v.isSummary) {
            tags += `<span class="v-tag tag-summary">🏆 年度大總結</span>`;
            specialClass = "card-special";
          } else if (v.isBirthday) {
            tags += `<span class="v-tag tag-bday">🎂 Ryan 生日場</span>`;
            specialClass = "card-special";
          } else if (v.isSolo) {
            tags += `<span class="v-tag tag-solo">🌟 個人特輯</span>`;
            specialClass = "card-special";
          } else {
            tags += `<span class="v-tag tag-normal">Book Club</span>`;
          }

          const embedUrl =
            v.type === "video"
              ? `https://www.youtube.com/embed/${v.id}`
              : `https://www.youtube.com/embed/videoseries?list=${v.id}`;
          const watchUrl =
            v.type === "video"
              ? `https://www.youtube.com/watch?v=${v.id}`
              : `https://www.youtube.com/playlist?list=${v.id}`;
          const btnText =
            v.type === "video" ? "📺 在 YouTube 觀看" : "📺 瀏覽 YouTube 清單";

          const card = document.createElement("div");
          card.className = `video-card ${specialClass} fade-in-element`;

          card.innerHTML = `
          <div class="video-wrapper">
              <iframe src="${embedUrl}" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
          </div>
          <div class="content-wrapper">
              <div class="v-date">${videoDate}</div>
              <h3 class="v-title">${v.title}</h3>
              <p class="v-desc">${v.desc}</p>
              <div style="margin-top:auto;">
                  <div class="link-group">
                      <div class="left-actions">
                          ${tags}
                          <button class="copy-btn" onclick="copyToClipboard('${watchUrl}', this)" title="複製連結">🔗 複製連結</button>
                      </div>
                      <a href="${watchUrl}" target="_blank" class="yt-link-btn">${btnText}</a>
                  </div>
              </div>
          </div>
          `;
          timeline.appendChild(card);
          scrollObserver.observe(card);
        });

        // 點擊後平滑滾動到導覽列位置 (讓使用者剛好可以從新內容最上方開始看)
        if (clickedBtn) {
          const anchor = document.getElementById("nav-anchor");
          const offset =
            anchor.getBoundingClientRect().top + window.scrollY - 10;
          window.scrollTo({ top: offset, behavior: "smooth" });
        }
      }

      // 初始化頁面
      buildNav();
      filterTimeline("all", null);

      // 處理所有現存的 fade-in-element (針對非動態生成的部分)
      document
        .querySelectorAll(".fade-in-element:not(#timeline .fade-in-element)")
        .forEach((el) => scrollObserver.observe(el));

      // ================= 背景動畫 (星空) =================
      const canvas = document.getElementById("canvas-bg");
      const ctx = canvas.getContext("2d");
      let w,
        h,
        stars = [];

      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      }

      class Star {
        constructor() {
          this.x = Math.random() * w;
          this.y = Math.random() * h;
          this.size = Math.random() * 1.5;
          this.speed = Math.random() * 0.5;
        }
        update() {
          this.y -= this.speed;
          if (this.y < 0) this.y = h;
          ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function initStars() {
        stars = Array(100)
          .fill()
          .map(() => new Star());
      }
      function animate() {
        ctx.clearRect(0, 0, w, h);
        stars.forEach((s) => s.update());
        requestAnimationFrame(animate);
      }

      window.addEventListener("resize", () => {
        resize();
        initStars();
      });
      resize();
      initStars();
      animate();
    </script>
