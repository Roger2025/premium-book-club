    <style>
      :root {
        --gold: #d4af37;
        --gold-glow: rgba(212, 175, 55, 0.4);
        --bg-dark: #09090b;
        --card-bg: rgba(20, 20, 20, 0.6);
        --glass-border: rgba(255, 255, 255, 0.08);
        --text-main: #f5f5f5;
        --text-sub: #a3a3a3;
        --blood-red: #ff4757;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        background-color: var(--bg-dark);
        color: var(--text-main);
        font-family: "Noto Serif TC", serif;
        overflow-x: hidden;
        line-height: 1.6;
      }

      /* --- 啟動畫面 (Splash Screen) --- */
      #splash-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: var(--bg-dark);
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
        transition:
          opacity 0.5s ease-out,
          visibility 0.5s ease-out;
      }

      .splash-content {
        text-align: center;
      }

      .splash-logo {
        font-family: "Cinzel", serif;
        font-size: 2.5rem;
        color: var(--gold);
        text-shadow: 0 0 20px var(--gold-glow);
        margin-bottom: 30px;
        letter-spacing: 2px;
        animation: pulseGold 2s infinite alternate;
      }

      .splash-loader {
        width: 100px;
        height: 2px;
        background: rgba(255, 255, 255, 0.1);
        margin: 0 auto;
        position: relative;
        overflow: hidden;
      }

      .splash-loader::after {
        content: "";
        position: absolute;
        left: -50px;
        width: 50px;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          var(--gold),
          transparent
        );
        animation: goldScan 1.2s infinite linear;
      }

      .splash-hidden {
        opacity: 0;
        visibility: hidden;
      }

      @keyframes pulseGold {
        0% {
          opacity: 0.7;
          transform: scale(0.98);
        }
        100% {
          opacity: 1;
          transform: scale(1.02);
        }
      }

      @keyframes goldScan {
        0% {
          left: -50px;
        }
        100% {
          left: 100%;
        }
      }

      /* --- 背景星空動畫 Canvas --- */
      #canvas-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        background: radial-gradient(
          ellipse at bottom,
          #1b2735 0%,
          #090a0f 100%
        );
      }

      /* --- 核心精神區 (Quote) --- */
      .hero-section {
        min-height: 90vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 2rem;
        position: relative;
      }

      .main-title {
        font-family: "Cinzel", serif;
        font-size: 3.5rem;
        color: var(--gold);
        text-shadow: 0 0 20px var(--gold-glow);
        margin-bottom: 3rem;
        letter-spacing: 0.2em;
        animation: fadeInDown 1s ease-out;
      }

      .quote-card {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--glass-border);
        padding: 3.5rem 3rem;
        max-width: 800px;
        position: relative;
        backdrop-filter: blur(10px);
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        animation: slideUp 1.2s ease-out;
        border-radius: 4px;
      }

      .quote-card::before {
        content: "❝";
        position: absolute;
        top: -30px;
        left: 20px;
        font-size: 6rem;
        color: rgba(255, 255, 255, 0.1);
        font-family: "Playfair Display", serif;
      }

      .jung-quote {
        font-size: 1.6rem;
        color: #e0e0e0;
        line-height: 2.2;
        text-align: center;
        letter-spacing: 3px;
        font-weight: 300;
      }

      .highlight-fate {
        color: var(--blood-red);
        font-size: 1.5em;
        font-weight: 900;
        text-shadow: 0 0 20px rgba(255, 71, 87, 0.5);
        margin: 0 5px;
        display: inline-block;
        transform: translateY(2px);

      .quote-book {
        text-align: right;
        font-style: italic;
        color: var(--text-sub);
        margin-top: 2rem;
        letter-spacing: 1px;

      .birthday-grid {

      // ================= 雙重備用機制的強效複製功能 =================
      window.copyToClipboard = function (url, btnElement) {
        const originalText = btnElement.innerHTML;

        const showSuccess = () => {
          btnElement.innerHTML = "✅ 已複製";
          btnElement.classList.add("copied");
          setTimeout(() => {
            btnElement.innerHTML = originalText;
            btnElement.classList.remove("copied");
          }, 2000);
        };

        const showError = () => {
          alert(
            "這台裝置的瀏覽器阻擋了自動複製功能，請手動長按右側的「瀏覽 YouTube」按鈕來複製網址！",
          );
        };

        // 第一重：使用現代 API (需在 HTTPS 下)
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard
            .writeText(url)
            .then(showSuccess)
            .catch(() => {
              fallbackCopyTextToClipboard(url, showSuccess, showError);
            });
        } else {
          // 第二重：退回傳統文字選取複製法 (支援舊版瀏覽器或 HTTP)
          fallbackCopyTextToClipboard(url, showSuccess, showError);
        }
      };

      function fallbackCopyTextToClipboard(text, onSuccess, onError) {
        var textArea = document.createElement("textarea");
        textArea.value = text;

        // 確保畫面不會因此滾動跳動
        textArea.style.top = "0";
        textArea.style.left = "0";
        textArea.style.position = "fixed";
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();

        try {
          var successful = document.execCommand("copy");
          if (successful) {
            onSuccess();
          } else {
            onError();
          }
        } catch (err) {
          onError();
        }
        document.body.removeChild(textArea);
      }

      // ================= 滾動監聽器 =================
      const scrollObserver = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              entry.target.classList.add("visible");
              scrollObserver.unobserve(entry.target);
            }
          });
        },
        {
          threshold: 0.15,
          rootMargin: "0px 0px -50px 0px",
        },
      );

      // ================= 渲染邏輯 =================
      const timeline = document.getElementById("timeline");
      videos.sort((a, b) => new Date(a.date) - new Date(b.date));

      let currentYear = "";

      videos.forEach((v) => {
        const videoYear = v.date.split("-")[0];
        const videoDate = v.date.replace(/-/g, " / ");

        if (videoYear !== currentYear) {
          currentYear = videoYear;
          const yearDiv = document.createElement("div");
          yearDiv.className = "year-separator fade-in-element";
          yearDiv.innerHTML = `<div class="year-text">${currentYear}</div>`;
          timeline.appendChild(yearDiv);
          scrollObserver.observe(yearDiv);
        }

        let tags = "";
        let specialClass = "";

        if (v.isSummary) {
          tags += `<span class="v-tag tag-summary">🏆 年度大總結</span>`;
          specialClass = "card-special";
        } else if (v.isBirthday) {
          tags += `<span class="v-tag tag-bday">🎂 Ryan 生日場</span>`;
          specialClass = "card-special";
        } else if (v.isSolo) {
          tags += `<span class="v-tag tag-solo">🌟 個人特輯</span>`;
          specialClass = "card-special";
        } else {
          tags += `<span class="v-tag tag-normal">Book Club</span>`;
        }

        const embedUrl =
          v.type === "video"
            ? `https://www.youtube.com/embed/${v.id}`
            : `https://www.youtube.com/embed/videoseries?list=${v.id}`;

        const watchUrl =
          v.type === "video"
            ? `https://www.youtube.com/watch?v=${v.id}`
            : `https://www.youtube.com/playlist?list=${v.id}`;

        const btnText =
          v.type === "video" ? "📺 在 YouTube 觀看" : "📺 瀏覽 YouTube 清單";

        const card = document.createElement("div");
        card.className = `video-card ${specialClass} fade-in-element`;

        card.innerHTML = `
        <div class="video-wrapper">
            <iframe src="${embedUrl}" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
        <div class="content-wrapper">
            <div class="v-date">${videoDate}</div>
            <h3 class="v-title">${v.title}</h3>
            <p class="v-desc">${v.desc}</p>
            <div style="margin-top:auto;">
                <div class="link-group">
                    <div class="left-actions">
                        ${tags}
                        <button class="copy-btn" onclick="copyToClipboard('${watchUrl}', this)" title="複製連結">🔗 複製連結</button>
                    </div>
                    <a href="${watchUrl}" target="_blank" class="yt-link-btn">${btnText}</a>
                </div>
            </div>
        </div>
      `;
        timeline.appendChild(card);
        scrollObserver.observe(card);
      });

      document
        .querySelectorAll(".fade-in-element")
        .forEach((el) => scrollObserver.observe(el));

      // ================= 背景動畫 (星空) =================
      const canvas = document.getElementById("canvas-bg");
      const ctx = canvas.getContext("2d");
      let w,
        h,
        stars = [];

      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      }

      class Star {
        constructor() {
          this.x = Math.random() * w;
          this.y = Math.random() * h;
          this.size = Math.random() * 1.5;
          this.speed = Math.random() * 0.5;
        }
        update() {
          this.y -= this.speed;
          if (this.y < 0) this.y = h;
          ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function initStars() {
        stars = Array(100)
          .fill()
          .map(() => new Star());
      }
      function animate() {
        ctx.clearRect(0, 0, w, h);
        stars.forEach((s) => s.update());
        requestAnimationFrame(animate);
      }

      window.addEventListener("resize", () => {
        resize();
        initStars();
      });
      resize();
      initStars();
      animate();
    </script>
  </body>
